<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Reply Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #efefec;
      --text: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #9c9c97;
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.25);
      --accent: #1a1a18;
      --accent-text: #ffffff;
      --info-bg: #e6f1fb;
      --info-text: #185fa5;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #242422;
        --bg-tertiary: #2a2a28;
        --text: #f0f0ec;
        --text-secondary: #a0a09a;
        --text-tertiary: #6b6b67;
        --border: rgba(255,255,255,0.12);
        --border-hover: rgba(255,255,255,0.25);
        --accent: #f0f0ec;
        --accent-text: #1a1a18;
        --info-bg: #0c447c;
        --info-text: #b5d4f4;
      }
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-tertiary);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .app {
      max-width: 620px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--info-bg);
      color: var(--info-text);
      margin-bottom: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 400;
    }

    input[type="password"],
    input[type="text"],
    textarea,
    select {
      width: 100%;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      appearance: none;
    }

    input[type="password"] {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--border-hover);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .divider {
      height: 0.5px;
      background: var(--border);
      margin: 1.25rem 0;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-hover);
      background: var(--bg);
      color: var(--text);
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:hover { background: var(--bg-secondary); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: transparent;
    }

    .btn-primary:hover { opacity: 0.85; background: var(--accent); }

    .result-box {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 1rem 1.1rem;
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
      min-height: 80px;
      white-space: pre-wrap;
      border: 0.5px solid var(--border);
    }

    .result-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .result-actions .btn { flex: 1; }

    .api-note {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 8px;
      text-align: center;
      line-height: 1.5;
    }

    .hidden { display: none; }

    .cost-note {
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: center;
      margin-top: 0.75rem;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 0.5px solid var(--border);
    }

    @media (max-width: 480px) {
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <div class="tag">Powered by Claude AI</div>
      <h1>Google Review Reply Generator</h1>
      <p>Paste a customer review and get a professional reply in seconds.</p>
    </div>

    <!-- API Key -->
    

    <!-- Main form -->
    <div class="card">
      <label>Paste the customer review</label>
      <textarea id="reviewText" placeholder="e.g. The service was really slow and the staff seemed uninterested. Won't be coming back."></textarea>

      <div class="divider"></div>

      <div class="controls">
        <div>
          <label>Business type</label>
          <select id="bizType">
            <option>Restaurant</option>
            <option>Salon / Barbershop</option>
            <option>Gym / Fitness studio</option>
            <option>Dental / Medical</option>
            <option>Retail shop</option>
            <option>Plumber / Tradesperson</option>
            <option>Cafe / Coffee shop</option>
            <option>Hotel / Accommodation</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label>Reply tone</label>
          <select id="tone">
            <option>Professional & apologetic</option>
            <option>Warm & friendly</option>
            <option>Concise & direct</option>
            <option>Grateful (positive review)</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" id="generateBtn" onclick="generateReply()">Generate reply</button>
      <p class="cost-note">Each reply costs less than $0.001 in API credits</p>
    </div>

    <!-- Result -->
    <div class="card hidden" id="resultCard">
      <label>Generated reply</label>
      <div class="result-box" id="resultBox"></div>
      <div class="result-actions">
        <button class="btn" onclick="copyReply(this)">Copy reply</button>
        <button class="btn" onclick="generateReply()">Try again</button>
      </div>
    </div>

    <div class="footer">
      Built with Claude AI &mdash; Anthropic
    </div>
  </div>

  <script>
    window.generateReply = async function () {
  console.log("clicked");

  const review = document.getElementById('reviewText').value;
  const bizType = document.getElementById('bizType').value;
  const tone = document.getElementById('tone').value;

  const btn = document.getElementById('generateBtn');
  const resultBox = document.getElementById('resultBox');
  const resultCard = document.getElementById('resultCard');

  const prompt = `You are the owner of a ${bizType}. ${review}. Reply in a ${tone} tone.`;

  try {
    btn.disabled = true;
    resultCard.classList.remove('hidden');
    resultBox.textContent = "Generating...";

    const response = await fetch('/.netlify/functions/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();

    resultBox.textContent =
      data.content?.[0]?.text || data.error || "No response";

  } catch (err) {
    console.error(err);
    resultBox.textContent = "Error occurred";
  }

  btn.disabled = false;
};
  </script>

</body>
</html>
